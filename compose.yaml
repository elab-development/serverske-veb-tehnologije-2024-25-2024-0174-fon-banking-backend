name: fon-banking

x-backend-environment: &backend-environment
  APP_NAME: Fon Banking
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://fon-banking.duckdns.org
  LOG_CHANNEL: stderr
  DB_CONNECTION: sqlite
  DB_DATABASE: /data/database.sqlite
  SESSION_DRIVER: array
  CACHE_STORE: file
  QUEUE_CONNECTION: sync

services:
  backend-init:
    build:
      context: .
    user: root
    env_file:
      - path: .env.docker
        required: false
    environment: *backend-environment
    command:
      - sh
      - -eu
      - -c
      - |
        test -n "$${APP_KEY}"
        chown www-data:www-data /data
        touch /data/database.sqlite
        chown www-data:www-data /data/database.sqlite
        exec setpriv --reuid=www-data --regid=www-data --init-groups php artisan migrate --force
    volumes:
      - backend-data:/data
    restart: "no"

  backend:
    build:
      context: .
    env_file:
      - path: .env.docker
        required: false
    environment: *backend-environment
    depends_on:
      backend-init:
        condition: service_completed_successfully
    volumes:
      - backend-data:/data
    networks:
      proxy:
        aliases:
          - fon-banking-backend
    restart: unless-stopped

volumes:
  backend-data:

networks:
  proxy:
    external: true
    name: dev-proxy